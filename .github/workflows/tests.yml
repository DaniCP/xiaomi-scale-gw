name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: MicroPython compile check
        run: for f in pico/*.py; do python -m mpy_cross -o /tmp/$(basename "$f" .py).mpy "$f"; done
